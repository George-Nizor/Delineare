# Pictures for lessons 12 to 19.

- file: 19-cast-shadows/park-sign-shadows.jpg
  credit: "Figaro, Bowen Park bandstand, 2005"
  alt: "A lawn in low sun. A green post with a sign beside it throws long thin shadows across the grass, all running the same way, each starting at the foot of the post."
  source: https://commons.wikimedia.org/wiki/File:Bowen-Park-bandstand.jpg
  licence: public domain

- file: 19-cast-shadows/amsterdam-canal-shadows.jpg
  credit: "Willem van de Poll, De Geldersekade in Amsterdam, 1933"
  alt: "A cobbled canal quay in low winter sun. Tree trunks and mooring posts throw long shadows across the cobbles towards the viewer, each shadow starting at the foot of its trunk."
  source: https://commons.wikimedia.org/wiki/File:De_Geldersekade_in_Amsterdam,_Bestanddeelnr_189-0067.jpg
  licence: CC0

- file: 19-cast-shadows/road-guardrail-shadows.jpg
  credit: "W. Carter, Main road in Ramsvik, 2020"
  alt: "A coast road in afternoon sun. A line of guardrail posts throws parallel shadows across the tarmac, and the rock face on the right throws one large shadow over the road."
  source: https://commons.wikimedia.org/wiki/File:Main_road_in_Ramsvik.jpg
  licence: CC0
