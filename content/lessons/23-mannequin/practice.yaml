# Practice for lesson 23. The item marked main is the lesson's exercise.

- id: mannequin-from-photos
  main: true
  title: Mannequins from photos
  kind: life
  minutes: 25
  text: "Find five photos of people in different poses. For each, draw a 30-second gesture, then build the bean, and then the limbs on top. Spend about 5 minutes on each pose. Use a pencil or pen on printer paper."
  steps: [Gesture, Bean, Exaggerate, Foreshorten, Attach the limbs]
  timer:
    rounds:
      - { label: "Pose 1", minutes: 5 }
      - { label: "Pose 2", minutes: 5 }
      - { label: "Pose 3", minutes: 5 }
      - { label: "Pose 4", minutes: 5 }
      - { label: "Pose 5", minutes: 5 }

- id: bean-warm-up
  title: Bean warm-up
  kind: warm-up
  minutes: 10
  text: "Draw only the bean, with its centerline, from ten photos of people. Spend 1 minute on each. Exaggerate the tilt, lean or twist."
  timer: { minutes: 10 }
  reference: { prompt: "Ten photos of people in different poses" }
  check:
    - Every bean has a centerline through both ovals.
    - The tilt or twist is stronger in your drawing than in the photo.

- id: bean-turned
  title: "One bean, four ways"
  kind: drill
  minutes: 10
  text: "Draw one bean standing straight, then tilted sideways, then twisted, then pointing toward you. Keep each one about 6 cm tall."
  timer: { minutes: 10 }
  check:
    - The tilted bean has a C-shaped centerline.
    - The twisted bean has an S-shaped centerline.
    - The foreshortened ovals are shorter and overlap more.
