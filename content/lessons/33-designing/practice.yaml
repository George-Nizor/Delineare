# Practice for lesson 33. The item marked main is the lesson's exercise.

- id: creature-three-views
  main: true
  title: "A creature in three views"
  kind: imagination
  minutes: 60
  text: "Collect three reference photos. Draw a part from each, then six silhouettes. Choose one, build it from forms, and draw it from the front, the side and three-quarters. Use pencil on printer paper."
  steps: [Collect, Study, Try silhouettes, Build it, Turn it]
  timer: { minutes: 60 }

- id: silhouette-set
  title: "Twelve silhouettes"
  kind: timed
  minutes: 15
  text: "Draw twelve small black silhouettes of a creature, each about a minute long. Combine a body from one reference with a head and legs from others."
  steps: [Try silhouettes]
  timer: { minutes: 15 }
  check:
    - Each outline is clearly different from the others.
    - Each one has a recognisable body, head and legs.

- id: part-studies
  title: "Part studies"
  kind: drill
  minutes: 15
  text: "Draw five parts from five photos, such as a wing, a claw, an ear, a leg and a tail. Make each about palm-sized."
  steps: [Collect, Study]
  timer: { minutes: 15 }
  reference: { prompt: "Five photos of different animals" }
  check:
    - Each part is drawn as simple forms.
    - You labelled each part with its animal.
