- id: two-minute-poses
  title: Three 2-minute poses
  kind: drill
  minutes: 6
  text: Draw three poses at 2 minutes each. Study each for 10 to 15 seconds before drawing. Then draw the head, the neck, the shoulder angle, the torso curve, the legs and the arms.
  timer:
    rounds:
      - { label: "Three poses at 2 minutes", minutes: 6, pose: 120 }
  reference:
    prompt: "Three people in action, 2 minutes each"
