# Practice for lesson 6. The item marked main is the lesson's exercise.

- id: pose-ladder
  main: true
  title: A ladder of poses
  kind: timed
  minutes: 12
  text: Use the pictures of people in action. Draw four poses at 30 seconds, three at 1 minute, then two at 2 minutes, a new picture each time. Use a soft pencil or marker on large paper, and move from the shoulder.
  steps: [Look first, Find the line of action, Tilt the torso, Add rhythm lines, Add thickness]
  timer:
    rounds:
      - { label: "Four poses at 30 seconds", seconds: 120, pose: 30 }
      - { label: "Three poses at 1 minute", minutes: 3, pose: 60 }
      - { label: "Two poses at 2 minutes", minutes: 4, pose: 120 }
  reference:
    prompt: "Standing, walking, leaning and working figures"
    images: [06-gesture/boucher-man-carrying-bundle.jpg, 06-gesture/callot-bearded-man-in-rags.jpg, 06-gesture/degas-dancer-adjusting-slipper.jpg, 06-gesture/fragonard-fisherman-pulling-net.jpg, 06-gesture/gavarni-sailor-standing-on-shore.jpg, 06-gesture/hollar-woman-carrying-vessel.jpg, 06-gesture/millet-reaper-bending.jpg, 06-gesture/mitelli-woodcutter.jpg, 06-gesture/muybridge-child-lifting-doll.jpg, 06-gesture/rembrandt-beggar-leaning-on-stick.jpg, 06-gesture/sargent-woman-walking.jpg, 06-gesture/schaufelein-sower-walking.jpg, 06-gesture/vincent-roman-servant-back-view.jpg, 06-gesture/callot-masked-swordsman.jpg, 06-gesture/degas-dancer-in-green.jpg, 06-gesture/millet-sower.jpg, 06-gesture/muybridge-woman-in-dark-dress-stepping.jpg, 06-gesture/callot-peg-leg.jpg, 06-gesture/degas-dancer-in-ukrainian-dress.jpg, 06-gesture/millet-wheat-reaper.jpg, 06-gesture/muybridge-woman-lifting-train.jpg, 06-gesture/callot-striding-with-cane.jpg, 06-gesture/degas-dancer-leaning-forward.jpg, 06-gesture/millet-woman-burning-weeds.jpg, 06-gesture/muybridge-woman-running-in-dark-dress.jpg, 06-gesture/callot-violin-player.jpg, 06-gesture/degas-dancer-with-a-fan.jpg, 06-gesture/millet-woman-emptying-bucket.jpg, 06-gesture/muybridge-woman-running-in-hat.jpg, 06-gesture/callot-wind-player.jpg, 06-gesture/degas-dancer-with-blue-sash.jpg, 06-gesture/millet-woman-with-rake.jpg, 06-gesture/muybridge-woman-with-parasol.jpg, 06-gesture/degas-seated-dancer.jpg, 06-gesture/millet-women-carrying-faggots.jpg]

