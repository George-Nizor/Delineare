# Practice for lesson 32. The item marked main is the lesson's exercise.

- id: six-thumbnails
  main: true
  title: "Six thumbnails"
  kind: drill
  minutes: 25
  text: "Rule six boxes about the size of your palm. Draw one subject in each in three values, changing the arrangement each time. Circle the one you would draw large. Use a soft pencil or a marker."
  steps: [Rule the page, Choose a subject, Fill each box, Change something, Choose]
  timer: { minutes: 25 }
  reference:
    prompt: "Pick one of these as your subject, or use a picture of your own."
    images: [32-composition/lighthouse.jpg, 32-composition/heron.jpg, 32-composition/horse-trot.jpg]

- id: thumbnails-from-photo
  title: "Thumbnails from a picture"
  kind: drill
  minutes: 15
  text: "Pick a picture with a clear subject. Draw it three times in three values, changing the crop each time."
  steps: [Choose a subject, Fill each box, Change something]
  timer: { minutes: 15 }
  reference:
    prompt: "One clear subject in each picture."
    images: [32-composition/heron.jpg, 32-composition/horse-trot.jpg, 32-composition/lighthouse.jpg]
  check:
    - Each crop frames the subject differently.
    - Each thumbnail uses three values.

- id: thumbnail-warm-up
  title: "Thumbnail warm-up"
  kind: warm-up
  minutes: 5
  text: "Draw four tiny boxes. Put a dark shape in each in a different place. Draw them in one minute each."
  steps: [Fill each box, Change something]
  timer: { minutes: 5 }
  check:
    - The dark shape sits in a different place in each box.
    - Every box has big, flat shapes.
