name: release

# Tag v<version> to publish a release the Instrumenta launcher installs and updates by itself.
# Run by hand, it builds and audits everything but does not publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    uses: George-Nizor/Instrumenta/.github/workflows/web-product-release.yml@main
    with:
      product: delineare
      # Launchers before 0.13.0 have no content policy or session partition for Delineare: they
      # could install this release but not open it.
      minimum-instrumenta: '0.13.0'
    permissions:
      contents: write
